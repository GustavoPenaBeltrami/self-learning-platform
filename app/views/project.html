<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>独学 · project</title>
<link rel="stylesheet" href="/app/styles/style.css">
<script src="/app/scripts/theme.js"></script>
<script src="/app/scripts/shell.js"></script>
<style>
  .lockup { display: block; width: 100%; max-width: 560px; margin: var(--spacing-32) auto var(--spacing-48); }
  .tagline { text-align: center; color: var(--muted); margin: calc(-1 * var(--spacing-32)) 0 var(--spacing-64); }
  .gloss { display: flex; gap: var(--spacing-40); flex-wrap: wrap; margin: 0 0 var(--spacing-32); }
  .gloss div { display: grid; gap: var(--spacing-8); justify-items: center; }
  .gloss b { font: 900 72px/1 var(--kanji); }
  .gloss span { font-size: 13px; color: var(--muted); }
  .sec { font-size: 15px; color: var(--ink); margin: var(--spacing-64) 0 var(--spacing-16); scroll-margin-top: calc(var(--bar-h) + 1rem); }
  .sec::before { content: '## '; color: var(--color-steel); }
  .lead { color: var(--color-chalk); max-width: 62ch; }
  .htop code { color: inherit; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); }
  .grid > div { background: var(--bg); padding: var(--spacing-24) var(--spacing-24) var(--spacing-24); display: grid; gap: .6rem; align-content: start; }
  .grid .k { font: 700 36px/1 var(--kanji); }
  .grid strong { font-size: 14px; }
  .grid strong span { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: .6rem; }
  .grid p { margin: 0; font-size: 13px; color: var(--color-chalk); }
  .grid .rule { font-size: 12px; color: var(--muted); border-top: 1px dashed var(--color-slate); padding-top: .6rem; }
  .grid .rule::before { content: '// '; color: var(--color-steel); }
</style>

<body>
<script>
const { app, tree, path } = mountShell('project');
path('~/notes/README.md');

const DOCS = 'https://selflearningplatform.github.io/docs/';
const SECTIONS = [['name', 'name'], ['start', 'quick start'], ['how', 'how it works'], ['teacher', 'ai teacher'], ['topics', 'your topics'], ['principles', 'principles']];
tree.innerHTML = folder('notes/', SECTIONS.length,
  `<ol>${SECTIONS.map(([id, label], i) => `<li><a href="#${id}"><span class="n">${i + 1}</span><span>${label}</span></a></li>`).join('')}</ol>`, true);

const rows = list => list.map(r => `<tr>${r.map((c, i) => `<td${i === r.length - 1 ? ' class="wide"' : ''}>${c}</td>`).join('')}</tr>`).join('');
const table = (head, list) => `<table class="htop static"><thead><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows(list)}</tbody></table>`;

app.innerHTML = `
  <div class="sheet">
  ${promptLine('~/notes', 'cat README.md')}
  <img class="brand lockup" src="/app/assets/lockup-horizontal.png" alt="独学 Self Learning Platform">
  <p class="tagline">an agent-powered hub for self-learners</p>

  <h2 class="sec" id="name">name</h2>
  <div class="gloss">
    <div><b>独</b><span>doku · by oneself</span></div>
    <div><b>学</b><span>gaku · learning</span></div>
  </div>
  <p class="lead">独学 (dokugaku) is the Japanese word for self-study. SLP, the Self Learning Platform, is built for exactly that: one person, one topic, and the discipline to keep going. The agent teaches, quizzes and grades. The learning stays yours.</p>
  <p class="lead">Everything you study is a topic: a book, a certification, a tool's docs, a course. SLP builds preparation, practice, feedback and spaced review around it, and keeps it all as Markdown and JSON on your disk. No database, no account, no cloud.</p>

  <h2 class="sec" id="start">quick start</h2>
  ${table(['#', 'STEP', 'HOW'], [
    ['1', 'set up the agent', 'open your agent at the repo root: <code>Read AGENTS.md, then read agent/skills/slp-setup/SKILL.md and follow it.</code>'],
    ['2', 'create a topic', '<code>/slp-init</code>. the agent interviews you and checks your level'],
    ['3', 'study', '<code>/slp-session</code> at the start of every session. it tells you what is pending'],
  ])}
  <p class="minor">// recommended setup: your material, this app and your agent side by side</p>

  <h2 class="sec" id="how">how it works</h2>
  ${table(['PATH', 'PIECE', 'ROLE'], [
    ['<code>agent/skills/</code>', 'skills', 'the method: teach, build exams, exercises and cards, grade, quiz'],
    ['<code>agent/agents/</code>', 'agents', 'a researcher that verifies before stating, a teacher per topic'],
    ['<code>topics/&lt;slug&gt;/</code>', 'filesystem', 'your study as markdown and json. no database'],
    ['<code>app/</code>', 'app', 'notebook, exams and cards, with dictation, mermaid and latex. tracks your sessions'],
  ])}
  <p class="minor">// core: the app. notes, exams and cards are plain markdown and json you can write by hand. agent layer: teaching, grading, sessions and the wiki, on any model you plug in</p>

  <h2 class="sec" id="teacher">ai teacher</h2>
  ${table(['SKILL', 'STEP', 'WHAT IT DOES'], [
    ['<code>/slp-setup</code>', 'setup', 'exposes the skills and agents to your agent'],
    ['<code>/slp-init</code>', 'setup', 'creates a topic and runs the first quiz'],
    ['<code>/slp-session</code>', 'plan', "what's pending today, and what to do"],
    ['<code>/slp-summarize</code>', 'prepare', 'summarizes material into the topic notes'],
    ['<code>/slp-teach</code>', 'prepare', 'teaches until it is understood, not memorized'],
    ['<code>/slp-exercises</code>', 'practice', 'an applied exercise: code, an adr, a critique'],
    ['<code>/slp-exam</code>', 'practice', 'builds an exam you sit in <code>2 exams</code>'],
    ['<code>/slp-grade</code>', 'feedback', 'grades the attempt against a rubric'],
    ['<code>/slp-cards</code>', 'review', 'flashcards from your notes, studied in <code>3 cards</code>'],
    ['<code>/slp-quiz</code>', 'check', 'ping-pong quiz of your level, repeatable'],
  ])}
  <p class="minor">// any agent works: skills use SKILL.md, AGENTS.md explains the project</p>

  <h2 class="sec" id="topics">your topics</h2>
  ${table(['PATH', 'WHAT IT HOLDS'], [
    ['<code>topic.json</code>', 'goals, languages, sources, routine'],
    ['<code>learning.md</code>', 'mission, glossary, your mistakes'],
    ['<code>notes/</code>', 'what you see in <code>1 notes</code>, one file per heading'],
    ['<code>exams/ exercises/</code>', 'what you sit in <code>2 exams</code>, attempts and feedback'],
    ['<code>cards/</code>', 'what you study in <code>3 cards</code>, and your reviews'],
    ['<code>wiki/</code>', "the agent's map of the subject and what you studied"],
    ['<code>progress/</code>', 'status, log and sessions'],
  ])}
  <p class="minor">// your topics are git-ignored. to keep them: git remote set-url origin &lt;your-repo&gt;</p>

  <h2 class="sec" id="principles">principles</h2>
  <div class="grid">
    <div><span class="k">簡素</span><strong>kanso<span>simplicity</span></strong><p>Remove until only what is needed is left.</p><span class="rule">one font, no shadows, no gradients</span></div>
    <div><span class="k">間</span><strong>ma<span>negative space</span></strong><p>Empty space is part of the design, not a gap to fill.</p><span class="rule">the ~ buffer, the space around the mark</span></div>
    <div><span class="k">渋い</span><strong>shibui<span>quiet beauty</span></strong><p>Understated. Nothing is decorated for its own sake.</p><span class="rule">hierarchy by lightness, not size</span></div>
    <div><span class="k">静寂</span><strong>seijaku<span>calm</span></strong><p>The interface stays silent while you study.</p><span class="rule">chrome lives in two bars</span></div>
  </div>
  <p class="minor">// full documentation: <a href="${DOCS}overview">selflearningplatform.github.io/docs</a></p>
  <div class="tildes"></div></div>`;
</script>
