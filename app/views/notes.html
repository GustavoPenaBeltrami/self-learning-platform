<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>独学 · notes</title>
<link rel="stylesheet" href="/app/styles/style.css">
<script src="/app/scripts/theme.js"></script>
<script src="/app/scripts/viz.js"></script>
<script src="/app/scripts/shell.js"></script>
<style>
  :root[data-font="serif"] { --reading-font: var(--serif); }
  :root[data-font="inter"] { --reading-font: Inter, "SF Pro Text", -apple-system, "Helvetica Neue", sans-serif; }
  :root[data-font="mono"]  { --reading-font: var(--code); }
  .doc { font-family: var(--reading-font, var(--code)); }
  :root[data-font="serif"] .doc, :root[data-font="inter"] .doc { font-size: 15px; }

  .cover { margin: 0 0 var(--spacing-32); }
  .cover h1 { font-size: var(--text-display); line-height: var(--leading-display); margin: 0; outline: 0; color: var(--ink); }
  .cover #subtitle { color: var(--muted); margin: .3rem 0 0; outline: 0; }
  .cover #subtitle::before { content: '# '; color: var(--color-steel); }
  .cover #subtitle:empty::after { content: 'topic subtitle'; color: var(--color-slate); }

  .doc { position: relative; counter-reset: h1 ln; outline: 0; min-height: 40vh; caret-color: var(--ansi-green); }
  .doc > :is(p, h1, h2, h3, h4, h5, h6, div, blockquote), .doc > :is(ul, ol) > li { position: relative; counter-increment: ln; }
  .doc > :is(p, h1, h2, h3, h4, h5, h6, div, blockquote)::after, .doc > :is(ul, ol) > li::after {
    content: counter(ln); position: absolute; top: 0; left: calc(-1 * var(--gutter));
    width: calc(var(--gutter) - 1.4rem); text-align: right;
    font-family: var(--mono); font-weight: 400; font-style: normal; color: var(--color-slate);
  }
  .doc > :is(ul, ol) > li::after { left: calc(-1 * var(--gutter) - 1.4rem); }
  .doc h1, .doc h2, .doc h3, .doc h4, .doc h5, .doc h6 { font-family: var(--reading-font, var(--code)); scroll-margin-top: calc(var(--bar-h) + 1rem); }
  .doc h1 { counter-increment: h1 ln; counter-reset: h2; font-size: 17px; line-height: 1.5; color: var(--ansi-blue); margin-top: 2.5rem; }
  .doc h1:first-child { margin-top: 0; }
  .doc h2 { counter-increment: h2 ln; counter-reset: h3; font-size: 15px; line-height: 1.6; color: var(--ansi-cyan); }
  .doc h3 { counter-increment: h3 ln; font-size: 14px; line-height: 1.7; color: var(--ansi-green); }
  .doc h4 { font-size: 14px; color: var(--ansi-yellow); }
  .doc h5 { font-size: 14px; color: var(--ansi-magenta); }
  .doc h1::before, .doc h2::before, .doc h3::before { color: var(--color-steel); font-weight: 400; }
  .doc h1::before { content: counter(h1) ". "; }
  .doc h2::before { content: counter(h1) "." counter(h2) "  "; }
  .doc h3::before { content: counter(h1) "." counter(h2) "." counter(h3) "  "; }
  .doc:empty::before { content: 'type /h1 to start the first section'; color: var(--muted); }
  .doc ul { padding-left: 1.4rem; list-style-type: '- '; }
  .doc ul ul { list-style-type: '· '; }
  .doc ol { padding-left: 2rem; }
  .doc li { margin: .15rem 0; }
  .doc li::marker { color: var(--ansi-orange); }
  .doc strong, .doc b { color: var(--color-paper); }
  .doc em, .doc i { color: var(--ansi-yellow); }

  mark { --c: var(--ansi-yellow); background: none; color: inherit; cursor: pointer; }
  mark.mk-highlight { background: color-mix(in srgb, var(--c) 35%, transparent); padding: 0 .1em; }
  mark.mk-underline { border-bottom: 2px solid var(--c); }
  mark.mk-strike { text-decoration: line-through; text-decoration-color: var(--c); text-decoration-thickness: 2px; }
  mark[data-comment]::after { content: '\00b0'; color: var(--accent); font-size: .9em; vertical-align: super; }
  mark.active { outline: 1px solid var(--accent); outline-offset: 2px; }

  .ref { color: var(--accent); text-decoration: none; border-bottom: 1px dotted currentColor; cursor: pointer; }

  .bubble {
    z-index: 60; max-width: 24rem; max-height: 14rem; overflow: hidden; padding: .7rem .9rem;
    font: 400 13px/1.6 var(--mono); color: var(--ink);
  }
  .bubble h4 { font: 700 12px/1.3 var(--mono); margin: 0 0 .35rem; color: var(--ansi-cyan); }
  .bubble.broken { color: var(--muted); }

  .mark-menu { z-index: 70; display: flex; align-items: center; gap: .1rem; padding: .25rem; }
  .mark-menu button {
    border: 0; background: none; border-radius: 0; color: var(--ink);
    padding: .35rem .4rem; display: grid; place-items: center; min-width: 1.8rem;
  }
  .mark-menu button:hover { background: var(--color-iron); }
  .mark-menu .swatch { width: 12px; height: 12px; min-width: 0; padding: 0; border-radius: 50%; margin: 0 .15rem; }
  .mark-menu .swatch[aria-pressed="true"] { outline: 1.5px solid var(--ink); outline-offset: 2px; }
  .swatches { display: contents; }
  #hex-preview { display: inline-block; border: 1px solid var(--line); flex: none; }
  #hex { width: 6.5rem; }
  .mark-menu .sep { width: 1px; height: 1.1rem; background: var(--line); margin: 0 .25rem; }
  .mark-menu select { border: 0; background: none; color: var(--ink); font: 400 12px/1 var(--mono); max-width: 18rem; padding: .35rem; }
  .mark-menu input[type="range"] { width: 8rem; accent-color: var(--accent); padding: 0 .4rem; }
  .mark-menu .readout { font: 400 12px/1 var(--mono); color: var(--muted); min-width: 2.4rem; text-align: right; }
  .mark-menu input[type="text"] {
    border: 0; background: none; color: var(--ink);
    font: 400 12px/1 var(--mono); width: 12rem; padding: .35rem .5rem;
  }
  .mark-menu input::placeholder { color: var(--muted); }

  .card {
    position: absolute; z-index: 10; width: 14rem; margin: 0;
    background: var(--bg); border: 1px solid var(--accent); border-radius: 0;
    font: 400 13px/1.6 var(--mono);
    opacity: .55; transition: opacity .12s ease;
  }
  .card:hover, .card:focus-within, .card.dragging { opacity: 1; }
  .card .card-body { padding: .7rem .8rem .5rem; outline: 0; min-height: 2.4rem; }
  .card .card-body:empty::before { content: 'margin note'; color: var(--muted); }
  .card .handle {
    position: absolute; top: -.6rem; left: .4rem; right: .4rem;
    display: flex; justify-content: space-between; pointer-events: none;
  }
  .card .handle span, .card .handle button {
    pointer-events: auto; border: 0; padding: 0 .4rem; background: var(--bg);
    font: 700 12px/1.1 var(--mono); color: var(--accent);
  }
  .card .handle span { cursor: grab; }
  .card.dragging .handle span { cursor: grabbing; }
  .card .handle button { cursor: pointer; color: var(--muted); opacity: 0; }
  .card:hover .handle button, .card:focus-within .handle button { opacity: 1; }
  .card .handle button:hover { color: var(--bad); }
  .card img { display: block; width: 100%; height: auto; padding: .7rem .8rem 0; }
  .card figcaption { padding: .5rem .8rem; color: var(--muted); outline: 0; font-size: 12px; }
  .card figcaption:empty::before { content: 'caption'; color: var(--color-slate); }

  .doc img.inline { display: block; max-width: 100%; height: auto; margin: var(--spacing-24) auto; cursor: pointer; }
  .doc img.inline.active { outline: 1px solid var(--accent); outline-offset: 3px; }

  .provisional { color: var(--muted); }

  .panel:has(.viewer) { padding-bottom: 0; }
  .viewer { display: flex; flex-direction: column; padding: var(--spacing-16) 1rem .5rem; }
  .viewer-head { display: flex; align-items: baseline; gap: 1rem; }
  .viewer-head .prompt { flex: 1; min-width: 0; margin-bottom: .6rem; }
  .viewer-close { border: 0; padding: 0 .3rem; background: none; color: var(--muted); cursor: pointer; font: inherit; }
  .viewer-close:hover { color: var(--ink); }
  .viewer-body { flex: 1; min-height: 0; overflow: auto; }
  .viewer-body iframe { display: block; width: 100%; height: 100%; border: 0; }
  .viewer-body img { display: block; max-width: 100%; height: auto; margin: 0 auto; }
  .viewer-body pre { margin: 0; white-space: pre-wrap; word-break: break-word; font: 400 13px/1.55 var(--mono); color: var(--ink); }
  .viewer-body td, .viewer-body th { white-space: nowrap; }

  .ls-row { display: flex; align-items: center; gap: 1rem; margin: 0 0 var(--spacing-16); }
  .ls-row .prompt { flex: 1; min-width: 0; margin: 0; }
  .ls-tools { display: flex; align-items: center; gap: .25rem; }
  .ls-btn {
    display: inline-flex; align-items: center; gap: .15rem; height: 1.7rem; padding: 0 .45rem;
    border: 1px solid transparent; background: none; color: var(--muted); cursor: pointer; font: 700 11px/1 var(--mono);
  }
  .ls-btn:hover { color: var(--ink); border-color: var(--color-slate); }
  .ls-btn.on { color: var(--accent); border-color: var(--accent); }
  .ls-btn .arrow { display: none; transition: transform .2s; }
  .ls-btn.on .arrow { display: block; }
  .ls-btn.desc .arrow { transform: rotate(180deg); }
  .ls-search { width: 0; opacity: 0; overflow: hidden; transition: width .25s ease, opacity .2s ease; }
  .ls-row.searching .ls-search { width: 14rem; opacity: 1; }
  .ls-search input {
    width: 14rem; height: 1.7rem; padding: 0 .5rem; border: 0; border-bottom: 1px solid var(--accent);
    background: none; color: var(--ink); font: inherit; outline: 0;
  }
  .ls-search input::placeholder { color: var(--muted); }
  .ls-row.searching #ls-find { color: var(--accent); }

  .tree .fold {
    flex: 0 0 1rem; padding: 0; border: 0; background: none; cursor: pointer;
    color: var(--muted); font: 400 13px/1 var(--mono);
  }
  .tree .fold:hover { color: var(--accent); }
  .tree .fold[aria-expanded="true"] { transform: rotate(90deg); }
  .tree a.n2 { padding-left: 1rem; } .tree a.n3 { padding-left: 2rem; }
  .tree #index a.n1 { color: var(--ansi-blue); }
  .tree button.add { flex: 1; text-align: left; border: 0; padding: .02rem .3rem; background: none; color: var(--muted); font: inherit; }
  .tree button.add:hover, .tree button.add.active { background: var(--color-iron); color: var(--ink); }

  @media (max-width: 1280px) {
    .card { position: static !important; width: auto; margin: 1rem 0; }
  }
</style>

<body>
<script>
const PALETTE = { yellow: '#d8c06a', green: '#8fbf7f', 'light blue': '#7ab8e0', pink: '#e08cb4' };
let custom = [];
const palette = () => [...Object.entries(PALETTE), ...custom.map(c => [c, c])];
const fixedColors = root => root.querySelectorAll('[style*="--c"]').forEach(el => {
  const hex = /var\(--ansi-\w+,\s*(#[0-9a-f]{3,8})\s*\)/i.exec(el.style.getPropertyValue('--c'))?.[1];
  if (hex) el.style.setProperty('--c', hex);
});

const { app, tree, tools, path, mode } = mountShell('notes');
const statusEl = document.getElementById('status');
const applySettings = s => {
  const fontSel = document.getElementById('font');
  if (fontSel) fontSel.value = s.font || 'mono';
  const voice = document.getElementById('voice');
  if (voice) voice.setAttribute('aria-label', voice.dataset.tip = 'Dictate · ' + keyFor('notes.dictate'));
  custom = s.mark_colors ? s.mark_colors.split(',') : [];
  renderSwatches();
};
const renderSwatches = () => {
  const box = document.getElementById('swatches');
  if (!box) return;
  if (!palette().some(([, c]) => c === color)) color = PALETTE.yellow;
  box.innerHTML = palette().map(([name, c]) => `<button class="swatch" style="--c:${c}" data-color="${c}"
    aria-pressed="${c === color}" data-tip="${esc(custom.includes(c) ? c + ' · right-click to remove' : name)}"${custom.includes(c) ? ' data-custom' : ''}></button>`).join('');
};
settings.then(applySettings);
addEventListener('settings-applied', e => applySettings(e.detail));
const zoom = () => parseFloat(app.style.zoom) || 1;
const slug = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '')
  .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'section';

let color = PALETTE.yellow, doc, titleEl, subtitle, index, topic, lastRange, stamp;

const loadTopics = async () => (await api('/api/topics')).topics;

function buildTree(topics, current) {
  tree.innerHTML = topics.map(t => folder(t.slug + '/', t.sections,
    t.slug === current ? '<div id="resources"></div><div id="index"></div>'
      : `<ol>${t.index.map((h, i) => `<li><a href="?topic=${encodeURIComponent(t.slug)}#${slug(h)}">
          <span class="n">${i + 1}</span><span>${esc(h)}</span></a></li>`).join('')
        || '<li class="empty">(empty)</li>'}</ol>`,
    t.slug === current, t.title)).join('');
}

const TYPES = ['book', 'certification', 'documentation', 'course', 'practice'];

function topicTools(topics, current) {
  tools.prepend(crudPill({ add: 'New topic', edit: 'Edit a topic', del: 'Delete topics' }, {
    add: () => topicForm(topics),
    edit: (b, e) => dropMenu(b, topics.map(t => [t.slug, esc(t.title)]), s => topicForm(topics, s), current, e.detail === 0),
    del: async () => {
      const slugs = await pickDelete('topics', topics.map(t => [t.slug, t.title, t.slug + '/']), [current], 'with all their notes, exams and cards');
      if (!slugs) return;
      try {
        await api('/api/topics', JSON.stringify({ delete: slugs }));
        location.href = slugs.includes(current) ? 'notes.html' : location.href;
      } catch (e) {
        statusEl.textContent = '✕ ' + e.message;
      }
    },
  }));
}

async function topicForm(topics, slugToEdit) {
  const t = slugToEdit ? await api('/api/topic/' + encodeURIComponent(slugToEdit)) : {};
  const lang = t.language || {}, routine = t.routine || {};
  const areas = [...new Set(topics.map(x => x.area).filter(Boolean))];
  const links = (t.links || []).map(l => `${l.title} | ${l.url || l.path}`).join('\n');
  const save = async () => {
    const f = Object.fromEntries(new FormData(m.form));
    if (!f.title.trim()) return m.status('a topic needs a title');
    const bad = lines(f.links).find(l => !l.includes('|'));
    if (bad) return m.status('link needs "title | url or path": ' + bad);
    const data = {
      title: f.title.trim(), subtitle: f.subtitle.trim(), type: f.type, area: f.area.trim(),
      goals: lines(f.goals), reason: f.reason.trim(),
      language: { source: f.source.trim(), notes: f.notes.trim(), exams: f.exams.trim() },
      routine: { cadence: f.cadence.trim(), session: f.session.trim() },
      end_date: f.end_date, sources_mode: f.sources_mode,
      links: lines(f.links).map(l => {
        const [title, ref] = l.split('|').map(x => x.trim());
        return /^https?:\/\//.test(ref) ? { title, url: ref } : { title, path: ref };
      }),
    };
    if (f.order) data.order = +f.order;
    try {
      const r = slugToEdit
        ? await api('/api/topic/' + encodeURIComponent(slugToEdit), JSON.stringify(data))
        : await api('/api/topics', JSON.stringify({ create: data, units: lines(f.units) }));
      m.dlg.close();
      if (slugToEdit && slugToEdit === topic?.slug) [titleEl.textContent, subtitle.textContent] = [data.title, data.subtitle];
      location.href = '?topic=' + encodeURIComponent(r.slug || slugToEdit);
    } catch (e) {
      m.status(e.message);
    }
  };
  const m = modal('wide-form', slugToEdit ? 'edit topic · ' + esc(slugToEdit) : 'new topic', `
    <label>title<input name="title" required value="${esc(t.title || '')}" autocomplete="off"></label>
    <label>subtitle<input name="subtitle" value="${esc(t.subtitle || '')}" autocomplete="off"></label>
    <div class="cols">
      <label>type<select name="type">${options(TYPES, t.type || 'book')}</select></label>
      <label>area<input name="area" list="topic-areas" value="${esc(t.area || '')}" placeholder="kebab-case" autocomplete="off"></label>
      <label>order<input name="order" type="number" min="1" max="999" value="${t.order < 1000 ? t.order : ''}" placeholder="next free"></label>
    </div>
    <datalist id="topic-areas">${areas.map(a => `<option value="${esc(a)}">`).join('')}</datalist>
    <label>goals · 1-3, one per line, concrete<textarea name="goals" rows="3" placeholder="be able to justify X by its trade-offs">${esc((t.goals || []).join('\n'))}</textarea></label>
    <label>reason · what changes once you have it<textarea name="reason" rows="2">${esc(t.reason || '')}</textarea></label>
    <div class="cols">
      <label>language · source<input name="source" value="${esc(lang.source || '')}" placeholder="en"></label>
      <label>notes<input name="notes" value="${esc(lang.notes || '')}" placeholder="en"></label>
      <label>exams<input name="exams" value="${esc(lang.exams || '')}" placeholder="en"></label>
    </div>
    <div class="cols">
      <label>routine · cadence<input name="cadence" value="${esc(routine.cadence || '')}" placeholder="3 times a week"></label>
      <label>session<input name="session" value="${esc(routine.session || '')}" placeholder="45 min"></label>
      <label>end date<input name="end_date" type="date" value="${esc(t.end_date || '')}"></label>
    </div>
    <label>sources<select name="sources_mode">${options(['both', 'web', 'local'], t.sources_mode || 'both')}</select></label>
    <label>links · one per line: title | http(s) link or ~/path<textarea name="links" rows="3" placeholder="HTTP: The Definitive Guide | ~/Books/http.pdf">${esc(links)}</textarea></label>
    ${slugToEdit ? '' : '<label>units · one per line, optional: chapters, domains, modules<textarea name="units" rows="3" placeholder="01 — methods and status codes"></textarea></label>'}`,
    [['⌘⏎', 'Save', 'cta'], ['Esc', 'Cancel']], save);
  m.buttons[0].onclick = save;
  m.form.elements.title.focus();
}

async function menu() {
  let topics;
  try {
    topics = await loadTopics();
  } catch (e) {
    app.innerHTML = offline(e);
    return;
  }
  buildTree(topics, null);
  topicTools(topics);
  path('~/topics');
  const arrow = '<svg class="arrow" viewBox="0 0 16 16" width="11" height="11" aria-hidden="true"><path d="M8 2v12M3.5 9.5 8 14l4.5-4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  app.innerHTML = `
    <div class="sheet">
    <div class="ls-row">
      <p class="prompt" id="ls-prompt"></p>
      <div class="ls-tools">
        <button class="ls-btn" data-sort="az" title="Sort alphabetically" aria-label="Sort alphabetically"><b>AZ</b>${arrow}</button>
        <button class="ls-btn" data-sort="edited" title="Sort by last edit" aria-label="Sort by last edit"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 4.5V8l2.5 1.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>${arrow}</button>
        <label class="ls-search"><input id="ls-q" type="search" placeholder="grep…" aria-label="Search topics" autocomplete="off" spellcheck="false"></label>
        <button class="ls-btn" id="ls-find" title="Search topics" aria-label="Search topics"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
      </div>
    </div>
    <table class="htop">
      <thead><tr><th class="num">#</th><th>TOPIC</th><th>TYPE</th><th class="num">SECT</th><th class="num">RES</th></tr></thead>
      <tbody id="ls-rows"></tbody>
    </table>
    <div class="tildes"></div></div>`;

  const q = document.getElementById('ls-q'), find = document.getElementById('ls-find');
  let sortBy = '', dir = 1;
  const render = () => {
    const needle = q.value.trim().toLowerCase();
    let list = topics.filter(l => !needle || [l.title, l.subtitle, l.slug, l.type].join(' ').toLowerCase().includes(needle));
    if (sortBy === 'az') list = [...list].sort((a, b) => dir * a.title.localeCompare(b.title));
    if (sortBy === 'edited') list = [...list].sort((a, b) => dir * (b.edited - a.edited));
    const cmd = sortBy === 'az' ? `ls -l | sort${dir < 0 ? ' -r' : ''}` : sortBy === 'edited' ? `ls -lt${dir < 0 ? 'r' : ''}` : 'ls -l';
    document.getElementById('ls-prompt').outerHTML = promptLine('~/topics', cmd + (needle ? ' | grep ' + needle : ''))
      .replace('<p class="prompt"', '<p class="prompt" id="ls-prompt"');
    app.querySelectorAll('[data-sort]').forEach(b => {
      b.classList.toggle('on', b.dataset.sort === sortBy);
      b.classList.toggle('desc', b.dataset.sort === sortBy && dir < 0);
    });
    document.getElementById('ls-rows').innerHTML = list.map(l => `
        <tr onclick="event.target.closest('a') || this.querySelector('a').click()">
          <td class="num">${l.order < 1000 ? String(l.order).padStart(3, '0') : '—'}</td>
          <td class="wide"><a href="?topic=${encodeURIComponent(l.slug)}">${esc(l.title)}</a><br><span class="sub">${esc(l.subtitle || '')}</span></td>
          <td class="type">${esc(l.type)}</td>
          <td class="num${l.sections ? '' : ' zero'}">${l.sections}</td>
          <td class="num${l.resources ? '' : ' zero'}">${l.resources}</td>
        </tr>`).join('') + (topics.length ? '' : noTopicsRow(5));
  };
  app.querySelectorAll('[data-sort]').forEach(b => b.onclick = () => {
    if (sortBy !== b.dataset.sort) [sortBy, dir] = [b.dataset.sort, 1];
    else if (dir > 0) dir = -1;
    else sortBy = '';
    render();
  });
  const close = () => { q.value = ''; app.querySelector('.ls-row').classList.remove('searching'); render(); };
  find.onmousedown = e => e.preventDefault();
  find.onclick = () => {
    if (app.querySelector('.ls-row').classList.contains('searching')) return close();
    app.querySelector('.ls-row').classList.add('searching');
    q.focus();
  };
  q.oninput = render;
  q.onkeydown = e => { if (e.key === 'Escape') { close(); find.focus(); } };
  q.onblur = () => { if (!q.value) app.querySelector('.ls-row').classList.remove('searching'); };
  render();
}

async function openTopic(name) {
  const [t, topics] = await Promise.all([api('/api/topic/' + encodeURIComponent(name)), loadTopics()]);
  topic = t;
  stamp = t.stamp;

/* ---------- dictation ---------- */
/* Local Whisper in server.py. It doesn't transcribe in streaming: while you
   talk, the accumulated audio is re-transcribed in a loop and the provisional
   (grey) text keeps getting overwritten, like a phone keyboard. After COMMIT_S
   seconds everything but the last segment is committed and the audio is
   trimmed there, so each round stays short. Float32 at 16 kHz straight from
   the microphone: the server doesn't need ffmpeg. */
const RATE = 16000, COMMIT_S = 15;
let dictation;
const osDictation = () => /Mac/.test(navigator.platform) ? 'use macOS dictation: press Fn twice'
  : /Win/.test(navigator.platform) ? 'use Windows voice typing: Win+H'
  : 'use Speech Note (flatpak install flathub net.mkiol.SpeechNote), with ydotool on Wayland';

async function dictate(button) {
  if (dictation) return dictation.done = true;
  const status = document.getElementById('status');
  let mic;
  try {
    mic = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    return status.textContent = 'no microphone: ' + e.message;
  }
  const d = dictation = { chunks: [], length: 0, done: false };
  const ctx = new AudioContext({ sampleRate: RATE });
  // ponytail: ScriptProcessor is deprecated but works in every browser and avoids
  // an AudioWorklet in a separate file. Move to AudioWorklet if one drops it.
  const node = ctx.createScriptProcessor(4096, 1, 1);
  node.onaudioprocess = e => {
    const c = e.inputBuffer.getChannelData(0).slice();
    d.chunks.push(c);
    d.length += c.length;
  };
  ctx.createMediaStreamSource(mic).connect(node);
  node.connect(ctx.destination);   // without this Chrome doesn't fire onaudioprocess; the output is silence

  restore();
  const span = document.createElement('span');
  span.className = 'provisional';
  const sel = getSelection();
  sel.rangeCount ? sel.getRangeAt(0).insertNode(span) : doc.append(span);
  button.classList.add('recording');
  status.textContent = `listening… ${keyFor('notes.dictate')} or the mic to finish`;

  const lang = topic.language?.notes;
  const voiceUrl = '/api/voice' + (lang ? '?lang=' + encodeURIComponent(lang) : '');
  let sent = 0, error;
  try {
    while (true) {
      const done = d.done;
      if (done) { mic.getTracks().forEach(t => t.stop()); node.disconnect(); }
      // nothing new, or less than 1 s (a short silence makes Whisper hallucinate)
      if (d.length === sent || (!done && d.length < RATE)) {
        if (done) break;
        await new Promise(r => setTimeout(r, 200));
        continue;
      }
      const n = d.chunks.length, audio = new Float32Array(d.length);
      d.chunks.reduce((o, t) => (audio.set(t, o), o + t.length), 0);
      sent = audio.length;
      const r = await api(voiceUrl, audio).catch(e => {
        throw e.data?.fallback ? new Error('no local dictation model, ' + osDictation()) : e;
      });

      if (done) { if (r.text) span.before(r.text + ' '); break; }
      const segs = r.segments;
      if (audio.length > COMMIT_S * RATE && segs.length > 1) {
        span.before(segs.slice(0, -1).map(s => s[1]).join(' ') + ' ');
        const from = Math.round(segs.at(-1)[0] * RATE);
        d.chunks.splice(0, n, audio.slice(from));   // whatever arrived during the fetch stays behind
        d.length -= from;
        sent -= from;
        span.textContent = segs.at(-1)[1];
      } else {
        span.textContent = r.text;
      }
    }
  } catch (e) {
    error = e;
  } finally {
    mic.getTracks().forEach(t => t.stop());
    ctx.close();
    span.remove();
    dictation = null;
    button.classList.remove('recording');
    buildIndex();
  }
  save().then(() => { if (error) status.textContent = 'not transcribed: ' + error.message; });
}

/* ---------- selection ---------- */
document.addEventListener('selectionchange', () => {
  const sel = getSelection();
  if (!sel.rangeCount || !doc?.contains(sel.anchorNode)) return;
  lastRange = sel.getRangeAt(0);
  document.getElementById('block').value = currentBlock();
});

function noteOf(node) {
  let h1 = '';
  for (const h of doc.querySelectorAll('h1')) {
    if (!node || !(h === node || h.compareDocumentPosition(node) & Node.DOCUMENT_POSITION_FOLLOWING)) break;
    h1 = h.textContent.trim();
  }
  return h1;
}

function restore() {
  doc.focus();
  if (!lastRange) return;
  const sel = getSelection();
  sel.removeAllRanges();
  sel.addRange(lastRange);
}

function wrap(create) {
  restore();
  const sel = getSelection();
  if (!sel.rangeCount || sel.isCollapsed) return null;
  const range = sel.getRangeAt(0);
  const el = create();
  el.appendChild(range.extractContents());
  range.insertNode(el);
  sel.removeAllRanges();
  save();
  return el;
}

function mark(cls) {
  const m = wrap(() => {
    const el = document.createElement('mark');
    el.className = cls;
    el.style.setProperty('--c', color);
    return el;
  });
  if (m) markMenu(m);
  return m;
}

/* ---------- blocks: heading, paragraph, list ---------- */
// ponytail: applyBlock, wrap, autoRef and card deletes edit the DOM directly and skip the browser undo stack; add an own history if ⌘Z after them matters
/* No execCommand('formatBlock'): it doesn't apply to loose text inside the
   contenteditable, which is exactly the case of an empty document. */
const BLOCKS = 'h1,h2,h3,h4,h5,h6,p,li,blockquote';

function blockOf(node) {
  const el = node?.nodeType === 3 ? node.parentElement : node;
  const b = el?.closest(BLOCKS);
  return b && doc.contains(b) ? b : null;
}

function caretAtEnd(el) {
  const r = document.createRange();
  r.selectNodeContents(el);
  r.collapse(false);
  const sel = getSelection();
  sel.removeAllRanges();
  sel.addRange(r);
}

function currentBlock() {
  const b = blockOf(getSelection().anchorNode);
  if (!b) return 'p';
  if (b.tagName === 'LI') return b.parentElement.tagName === 'OL' ? 'ol' : 'list';
  return /^H[1-6]$/.test(b.tagName) ? b.tagName.toLowerCase() : 'p';
}

function keepCaret(change) {
  const sel = getSelection();
  const n = sel.anchorNode, o = sel.anchorOffset;
  const el = change();
  if (!el.textContent && !el.querySelector('img')) el.innerHTML = '<br>';
  if (!n?.isConnected || !el.contains(n)) return caretAtEnd(el);
  const r = document.createRange();
  r.setStart(n, Math.min(o, n.nodeType === 3 ? n.length : n.childNodes.length));
  r.collapse(true);
  sel.removeAllRanges();
  sel.addRange(r);
}

function applyBlock(tag) {
  const node = getSelection().anchorNode;
  if (!node || !doc.contains(node)) return;
  const b = blockOf(node);
  const li = b?.tagName === 'LI' ? b : null;

  if (tag === 'list' || tag === 'ul' || tag === 'ol') {
    const type = tag === 'ol' ? 'OL' : 'UL';
    if (li) return li.parentElement.tagName === type || keepCaret(() => {
      const old = li.parentElement, fresh = document.createElement(type);
      fresh.append(...old.childNodes);
      old.replaceWith(fresh);
      return li;
    });
    return keepCaret(() => {
      const list = document.createElement(type);
      const item = list.appendChild(document.createElement('li'));
      move(node, list, item);
      return item;
    });
  }
  keepCaret(() => {
    const el = document.createElement(tag);
    if (!li) {
      move(node, el, el);
      return el;
    }
    const list = li.parentElement;
    const rest = [];
    for (let n = li.nextElementSibling; n; n = n.nextElementSibling) rest.push(n);
    if (rest.length) {
      const tail = document.createElement(list.tagName);
      tail.append(...rest);
      list.after(tail);
    }
    el.append(...li.childNodes);
    list.after(el);
    li.remove();
    if (!list.children.length) list.remove();
    return el;
  });
}

/* Puts the current line inside `container`, leaving the content in `target`. */
function move(node, container, target) {
  const block = blockOf(node);
  const parent = node.nodeType === 3 ? node.parentElement : node;
  if (block) {
    target.append(...block.childNodes);
    block.replaceWith(container);
  } else if (parent && parent !== doc && parent.tagName === 'DIV' && doc.contains(parent)) {
    target.append(...parent.childNodes);   // the <div> Chrome creates on Enter
    parent.replaceWith(container);
  } else {
    node.replaceWith(container);
    target.appendChild(node);
  }
}

/* ---------- typing shortcuts: /h1, /list, "- " ---------- */
function shortcuts() {
  const sel = getSelection();
  const n = sel.anchorNode;
  if (!n || n.nodeType !== 3 || !doc.contains(n)) return false;

  const before = n.data.slice(0, sel.anchorOffset).replace(/ /g, ' ');
  const m = /^(?:\/(h[1-6]|p|list|ul|ol)|([-*]) |(\d+)\. )$/i.exec(before);
  if (!m) return false;
  // it has to be the start of the line: nothing typed before it in the same block
  if (n.previousSibling?.textContent.trim()) return false;

  n.deleteData(0, sel.anchorOffset);
  applyBlock(m[1] ? m[1].toLowerCase() : m[2] ? 'list' : 'ol');
  return true;
}

/* ---------- references ---------- */
/* Turns [[text]] into a reference as soon as the bracket closes. */
function autoRef() {
  const sel = getSelection();
  const n = sel.anchorNode;
  if (!n || n.nodeType !== 3) return;
  const m = /\[\[([^\[\]]+)\]\]$/.exec(n.data.slice(0, sel.anchorOffset));
  if (!m) return;
  const range = document.createRange();
  range.setStart(n, sel.anchorOffset - m[0].length);
  range.setEnd(n, sel.anchorOffset);
  range.deleteContents();
  const a = document.createElement('a');
  a.className = 'ref';
  a.href = '#' + slug(m[1]);
  a.textContent = m[1];
  range.insertNode(a);
  const tail = document.createTextNode(' ');
  a.after(tail);
  const r2 = document.createRange();
  r2.setStart(tail, 1);
  r2.collapse(true);
  sel.removeAllRanges();
  sel.addRange(r2);
}

const headings = () => [...doc.querySelectorAll('h1,h2,h3,h4,h5,h6')];

function goTo(id) {
  headings().find(h => h.id === id)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

let bubble;
const closeBubble = () => { bubble?.remove(); bubble = null; };

function showBubble(anchor, html, broken) {
  closeBubble();
  bubble = document.createElement('div');
  bubble.className = 'bubble float' + (broken ? ' broken' : '');
  bubble.innerHTML = html;
  document.body.appendChild(bubble);
  placeNear(bubble, anchor);
  const leave = () => { closeBubble(); anchor.removeEventListener('mouseleave', leave); };
  anchor.addEventListener('mouseleave', leave);
}

function commentBubble(m) {
  showBubble(m, `<h4>Comment</h4>${esc(m.dataset.comment)}`);
}

function refBubble(a) {
  const id = a.hash.slice(1);
  const target = headings().find(h => h.id === id);
  if (!target) return showBubble(a, 'No section with that name exists yet.', true);
  const level = +target.tagName[1];
  const parts = [];
  for (let n = target.nextElementSibling; n; n = n.nextElementSibling) {
    if (/^H[1-6]$/.test(n.tagName) && +n.tagName[1] <= level) break;
    if (!n.classList.contains('card')) parts.push(n.textContent);
  }
  const body = parts.join(' ').replace(/\s+/g, ' ').trim();
  showBubble(a, `<h4>${esc(target.textContent)}</h4>` +
    esc(body.slice(0, 420) || 'Empty section.') + (body.length > 420 ? '…' : ''));
}

let menu2, active;

function closeMenu() {
  menu2?.remove();
  menu2 = null;
  active?.classList.remove('active');
  active = null;
}

function openMenu(anchor, html) {
  closeMenu();
  closeBubble();
  active = anchor;
  anchor.classList.add('active');
  menu2 = document.createElement('div');
  menu2.className = 'mark-menu float';
  menu2.innerHTML = html;
  document.body.appendChild(menu2);
  placeNear(menu2, anchor);
  menu2.onmousedown = e => { if (!['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) e.preventDefault(); };
  return menu2;
}

function markMenu(markEl) {
  const current = markEl.style.getPropertyValue('--c').trim();
  const m = openMenu(markEl,
    palette().map(([name, c]) => `<button class="swatch" data-color="${c}" style="background:${c}"
        aria-pressed="${c.toLowerCase() === current.toLowerCase()}" aria-label="${esc(name)}"></button>`).join('')
    + '<span class="sep"></span>'
    + `<input type="text" id="mark-comment" placeholder="Comment…" aria-label="comment" value="${esc(markEl.dataset.comment || '')}">`
    + `<button data-action="remove" aria-label="remove the mark">${svg('remove', 14)}</button>`);

  m.querySelectorAll('[data-color]').forEach(b => b.onclick = () => {
    markEl.style.setProperty('--c', b.dataset.color);
    m.querySelectorAll('[data-color]').forEach(o => o.setAttribute('aria-pressed', o === b));
    save();
  });
  const field = m.querySelector('#mark-comment');
  field.oninput = () => {
    field.value.trim() ? markEl.dataset.comment = field.value.trim() : delete markEl.dataset.comment;
    save();
  };
  field.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); closeMenu(); } };
  m.querySelector('[data-action="remove"]').onclick = () => {
    markEl.replaceWith(...markEl.childNodes);
    closeMenu();
    save();
  };
}

const VIZ_SEED = {
  mermaid: 'graph TD\n  A[Unconditional truth] --> B[Derived step]',
  math: 'p_{99} = \\frac{a}{b}',
};

function insertViz(kind) {
  restore();
  document.execCommand('insertHTML', false,
    vizBlock(kind, VIZ_SEED[kind]).replace('<figure ', '<figure data-new="1" ') + '<p><br></p>');
  const fig = doc.querySelector('figure.viz[data-new]');
  save();
  if (!fig) return;
  delete fig.dataset.new;
  vizPaint(fig).then(() => vizMenu(fig));
}

function vizMenu(fig) {
  const source = fig.querySelector('.src');
  const m = openMenu(fig,
    `<textarea class="editor-viz" spellcheck="false" aria-label="${fig.dataset.kind === 'math' ? 'latex' : 'mermaid'} source">${esc(source.textContent)}</textarea>`
    + `<button data-action="remove" aria-label="delete the drawing">${svg('remove', 14)}</button>`);

  const field = m.querySelector('textarea');
  field.focus();
  let repaint;
  field.oninput = () => {
    source.textContent = field.value;
    clearTimeout(repaint);
    repaint = setTimeout(() => vizPaint(fig), 350);
    save();
  };
  m.querySelector('[data-action="remove"]').onclick = () => {
    fig.remove();
    closeMenu();
    save();
  };
}

function imageMenu(img) {
  const width = parseInt(img.style.width) || 100;
  const m = openMenu(img,
    `<input type="range" min="20" max="100" step="5" value="${width}" aria-label="image width">`
    + `<span class="readout">${width}%</span><span class="sep"></span>`
    + `<button data-action="remove" aria-label="delete the image">${svg('remove', 14)}</button>`);

  const slider = m.querySelector('input');
  const readout = m.querySelector('.readout');
  slider.oninput = () => {
    img.style.width = slider.value + '%';
    readout.textContent = slider.value + '%';
    save();
  };
  m.querySelector('[data-action="remove"]').onclick = () => {
    img.remove();
    closeMenu();
    save();
  };
}

function referenceMenu(button) {
  const list = headingList();
  if (!list.length) return openMenu(button,
    '<span class="readout" style="min-width:0">No sections to point to yet.</span>');

  const m = openMenu(button, `<select id="ref-target" size="1" aria-label="section">
      ${list.map(h => `<option value="${h.id}">${' '.repeat((h.level - 1) * 3)}${esc(h.number)} ${esc(h.text)}</option>`).join('')}
    </select>`);
  const sel = m.querySelector('select');
  sel.focus();
  sel.onchange = () => {
    const h = list.find(x => x.id === sel.value);
    insertRef(h.id, h.text);
    closeMenu();
  };
}

function insertRef(id, text) {
  restore();
  const sel = getSelection();
  if (sel.rangeCount && !sel.isCollapsed) {
    wrap(() => {
      const a = document.createElement('a');
      a.className = 'ref';
      a.href = '#' + id;
      return a;
    });
  } else {
    document.execCommand('insertHTML', false, `<a class="ref" href="#${id}">${esc(text)}</a>&nbsp;`);
  }
  save();
}

function buildResources() {
  const box = document.getElementById('resources');
  const source = '/api/source?topic=' + encodeURIComponent(topic.slug) + '&i=';
  const rows = [
    ...(topic.resources || []).map(r =>
      `<li><a href="${esc(r.path)}" target="_blank" title="${esc(r.name)}" data-name="${esc(r.name)}"><span>${esc(r.name)}</span><span class="size">${r.kb < 1024 ? r.kb + ' KB' : (r.kb / 1024).toFixed(1) + ' MB'}</span></a></li>`),
    ...(topic.links || []).map((e, i) => e.url && /^https?:\/\//i.test(e.url)
      ? `<li><a href="${esc(e.url)}" target="_blank" rel="noopener noreferrer" title="${esc(e.url)}"><span>${esc(e.title)}</span><span class="size">↗</span></a></li>`
      : e.path ? `<li><a href="${source + i}" target="_blank" title="${esc(e.path)}" data-name="${esc(e.path)}"><span>${esc(e.title)}</span><span class="size">local</span></a></li>` : ''),
  ];
  box.innerHTML = `<div class="folder">resources/</div><ul>${rows.join('')}<li><button class="add" aria-label="add a resource">+ add</button></li></ul>`;
  box.querySelector('.add').onclick = e => addMenu(e.currentTarget);
  box.querySelectorAll('a[data-name]').forEach(a => a.onclick = e => {
    if (e.metaKey || e.ctrlKey) return;
    e.preventDefault();
    preview(a.href, a.dataset.name);
  });
}

const TEXT_EXT = /\.(md|markdown|txt|text|log|json|ya?ml|toml|xml|html?|css|js|ts|py|sh|sql|ini|cfg|rst|tex)$/i;
const IMG_EXT = /\.(png|jpe?g|gif|webp|avif|svg)$/i;

function parseCsv(t, sep) {
  const rows = [[]];
  let f = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) {
      if (c !== '"') f += c;
      else if (t[i + 1] === '"') { f += '"'; i++; }
      else q = false;
    } else if (c === '"') q = true;
    else if (c === sep) { rows.at(-1).push(f); f = ''; }
    else if (c === '\n') { rows.at(-1).push(f.replace(/\r$/, '')); f = ''; rows.push([]); }
    else f += c;
  }
  rows.at(-1).push(f.replace(/\r$/, ''));
  return rows.filter(r => r.join(''));
}

function closePreview() {
  const v = app.querySelector('.viewer');
  if (!v) return;
  v.remove();
  app.querySelector('.sheet').hidden = false;
  scrollTo(0, +v.dataset.y);
}

async function preview(href, name) {
  const kind = /\.pdf$/i.test(name) ? 'pdf' : IMG_EXT.test(name) ? 'img' : /\.(csv|tsv)$/i.test(name) ? 'csv' : TEXT_EXT.test(name) ? 'text' : null;
  if (!kind) return window.open(href, '_blank', 'noopener');
  closePreview();
  const v = document.createElement('div');
  v.className = 'viewer';
  v.dataset.y = scrollY;
  v.style.height = `calc((100vh - var(--bar-h) - var(--status-h)) / ${zoom()})`;
  app.querySelector('.sheet').hidden = true;
  scrollTo(0, 0);
  v.innerHTML = `<div class="viewer-head">${promptLine('~/topics/' + topic.slug, 'less ' + name.split('/').pop())}
    <button class="viewer-close" aria-label="Close preview" title="Close · Esc">✕</button></div><div class="viewer-body"></div>`;
  app.appendChild(v);
  v.querySelector('.viewer-close').onclick = closePreview;
  const body = v.querySelector('.viewer-body');
  if (kind === 'pdf') return body.innerHTML = `<iframe src="${esc(href)}#toolbar=0&navpanes=0" title="${esc(name)}"></iframe>`;
  if (kind === 'img') return body.innerHTML = `<img src="${esc(href)}" alt="${esc(name)}">`;
  try {
    const res = await fetch(href);
    if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
    const t = await res.text();
    if (kind === 'text') return body.innerHTML = `<pre>${esc(t)}</pre>`;
    // ponytail: first 2000 rows only, paginate if big CSVs matter
    const [head = [], ...rows] = parseCsv(t, /\.tsv$/i.test(name) ? '\t' : ',').slice(0, 2001);
    body.innerHTML = `<table class="htop static"><thead><tr>${head.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead>
      <tbody>${rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  } catch (e) {
    body.innerHTML = `<p class="prompt"><span class="p-sig">✕</span> could not open ${esc(name)}: ${esc(e.message)}</p>`;
  }
}
addEventListener('keydown', e => { if (e.key === 'Escape' && app.querySelector('.viewer')) closePreview(); });

function addMenu(button) {
  const m = openMenu(button, `<button data-action="file">file…</button><span class="sep"></span>`
    + '<input type="text" id="add-link" placeholder="url or ~/path/to/file" aria-label="link or path">');
  const input = m.querySelector('#add-link');
  input.focus();
  m.querySelector('[data-action="file"]').onclick = () => {
    const pick = Object.assign(document.createElement('input'), { type: 'file', multiple: true });
    pick.onchange = () => { closeMenu(); uploadResources([...pick.files]); };
    pick.click();
  };
  input.onkeydown = e => {
    if (e.key !== 'Enter' || !input.value.trim()) return;
    e.preventDefault();
    addLink(input.value.trim());
    closeMenu();
  };
}

async function refreshResources() {
  const t = await api(topicUrl()).catch(() => null);
  if (!t) return;
  topic.resources = t.resources;
  topic.links = t.links;
  buildResources();
}

async function uploadResources(files) {
  for (const f of files) {
    statusEl.textContent = `uploading ${f.name}…`;
    try {
      await api(`${topicUrl()}/resource?name=${encodeURIComponent(f.name)}`, f);
    } catch (e) {
      statusEl.textContent = `✕ ${f.name}: ${e.message}`;
      return refreshResources();
    }
  }
  statusEl.textContent = files.length ? 'uploaded' : '';
  refreshResources();
}

function addLink(value) {
  const title = decodeURIComponent(value.replace(/[?#].*$/, '').split(/[\\/]/).filter(Boolean).pop() || value);
  const entry = { title, [/^https?:\/\//i.test(value) ? 'url' : 'path']: value };
  queue(async () => {
    try {
      await api(topicUrl(), JSON.stringify({ links: [...(topic.links || []), entry] }));
      statusEl.textContent = 'added ' + title;
      await refreshResources();
    } catch (e) {
      statusEl.textContent = 'not added: ' + e.message;
    }
  });
}

function headingList() {
  const n = [0, 0, 0], seen = {};
  return headings().map(h => {
    const level = +h.tagName[1];
    if (level <= 3) {
      n[level - 1]++;
      for (let i = level; i < 3; i++) n[i] = 0;
    }
    const base = slug(h.textContent);
    seen[base] = (seen[base] || 0) + 1;
    h.id = seen[base] > 1 ? `${base}-${seen[base]}` : base;
    return { id: h.id, level, text: h.textContent, number: level <= 3 ? n.slice(0, level).join('.') : '' };
  });
}

/* Foldable: starts fully folded and each arrow unfolds only its direct
   children. Lives outside because the index is rebuilt on every keystroke. */
const expanded = new Set();

function buildIndex() {
  const list = headingList();
  const ancestors = [];
  const rows = list.map((h, i) => {
    while (ancestors.length && ancestors.at(-1).level >= h.level) ancestors.pop();
    const hidden = ancestors.some(a => !expanded.has(a.id));
    ancestors.push(h);
    const arrow = list[i + 1]?.level > h.level
      ? `<button class="fold" data-id="${h.id}" aria-expanded="${expanded.has(h.id)}" aria-label="Fold or unfold">›</button>`
      : '<span class="fold"></span>';
    return `<li${hidden ? ' hidden' : ''}>${arrow}<a href="#${h.id}" class="n${h.level}">
      <span class="n">${esc(h.number)}</span><span>${esc(h.text)}</span></a></li>`;
  });
  const add = '<li><span class="fold"></span><button class="add" aria-label="add a note">+ add</button></li>';
  index.innerHTML = `<div class="folder">notes/</div><ol>${rows.join('')}${add}</ol>`;
  index.querySelector('.add').onclick = addSection;
  index.querySelectorAll('a').forEach(a => a.onclick = e => {
    e.preventDefault(); closePreview(); goTo(a.hash.slice(1));
  });
  index.querySelectorAll('button.fold').forEach(b => b.onclick = () => {
    expanded.delete(b.dataset.id) || expanded.add(b.dataset.id);
    buildIndex();
  });
}

function addSection() {
  const h = document.createElement('h1');
  h.textContent = 'New note';
  const last = [...doc.children].filter(c => !c.classList.contains('card')).at(-1);
  last ? last.after(h) : doc.prepend(h);
  doc.focus();
  const r = document.createRange();
  r.selectNodeContents(h);
  getSelection().removeAllRanges();
  getSelection().addRange(r);
  h.scrollIntoView({ block: 'center', behavior: 'smooth' });
  buildIndex();
  save();
}

/* ---------- cards ---------- */
function createCard({ x, y, body = '', img = null, caption = '' }) {
  const el = document.createElement('aside');
  el.className = 'card';
  el.contentEditable = 'false';
  el.dataset.x = x ?? doc.offsetWidth + 32;
  el.dataset.y = y ?? Math.max(0, Math.round(scrollY / zoom() + 100 - doc.offsetTop));
  el.innerHTML = handle(img)
    + (img ? `<img src="${esc(img)}" alt=""><figcaption contenteditable>${esc(caption)}</figcaption>`
           : `<div class="card-body" contenteditable>${body}</div>`);
  doc.appendChild(el);
  activateCard(el);
  place(el);
  return el;
}

const handle = img => `<div class="handle"><span title="Drag">${img ? 'figure' : 'note'}</span>
  <button title="Delete">✕</button></div>`;

function place(el) {
  el.style.left = el.dataset.x + 'px';
  el.style.top = el.dataset.y + 'px';
}

function placeCards() {
  doc.querySelectorAll('.card').forEach(el => {
    el.contentEditable = 'false';
    if (!el.querySelector('.handle')) el.insertAdjacentHTML('afterbegin', handle(el.querySelector('img')));
    place(el);
    activateCard(el);
  });
}

function activateCard(el) {
  el.querySelector('.handle button').onclick = () => { el.remove(); save(); };
  el.querySelectorAll('[contenteditable=""],[contenteditable="true"]')
    .forEach(c => c.addEventListener('input', save));

  const grip = el.querySelector('.handle span');
  grip.onpointerdown = e => {
    const z = zoom(), dx = e.clientX / z - el.offsetLeft, dy = e.clientY / z - el.offsetTop;
    grip.setPointerCapture(e.pointerId);
    el.classList.add('dragging');
    grip.onpointermove = m => {
      el.dataset.x = Math.round(Math.min(doc.offsetWidth + 340, Math.max(-280, m.clientX / z - dx)));
      el.dataset.y = Math.max(0, Math.round(m.clientY / z - dy));
      place(el);
    };
    grip.onpointerup = () => {
      grip.onpointermove = grip.onpointerup = null;
      el.classList.remove('dragging');
      save();
    };
  };
}

/* ---------- saving ---------- */
function snapshot() {
  const copy = doc.cloneNode(true);
  copy.querySelectorAll('mark').forEach(m => m.classList.remove('active'));
  copy.querySelectorAll('.provisional').forEach(s => s.remove());   // half-transcribed dictation
  copy.querySelectorAll('figure.viz').forEach(f => {
    f.classList.remove('painted', 'active');   // the SVG is derived: the <pre class="src"> rules
    f.removeAttribute('data-error');
    f.querySelector('.view')?.replaceChildren();
  });
  copy.querySelectorAll('.card').forEach(t => {
    t.removeAttribute('style');            // the position lives in data-x / data-y
    t.removeAttribute('contenteditable');
    t.querySelector('.handle')?.remove();  // the handle is injected again on open
  });
  return copy.innerHTML;
}

const topicUrl = () => '/api/topic/' + encodeURIComponent(topic.slug);
const keptKey = () => 'unsaved:' + topic.slug;
let pending = null, inflight = 0, conflict = false, saving = Promise.resolve(), waiters = [];
const queue = fn => (saving = saving.then(fn).catch(() => {}));
const payload = () => JSON.stringify({
  title: titleEl.textContent.trim(), subtitle: subtitle.textContent.trim(), html: snapshot(), stamp,
});

function save() {
  clearTimeout(pending);
  if (!conflict) statusEl.textContent = 'saving…';
  pending = setTimeout(flush, 900);
  return new Promise(r => waiters.push(r));
}

function flush() {
  clearTimeout(pending);
  pending = null;
  const done = waiters.splice(0);
  queue(send).then(() => done.forEach(r => r()));
}

async function send() {
  if (conflict) return keep();
  inflight++;
  try {
    const r = await api(topicUrl(), payload());
    stamp = r.stamp;
    const time = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
    statusEl.textContent = `${time} · ${r.sections.length} ${r.sections.length === 1 ? 'section' : 'sections'}`;
  } catch (e) {
    if (e.status === 409) { conflict = true; keep(); }
    else statusEl.textContent = 'not saved: ' + e.message;
  } finally {
    inflight--;
  }
}

function keep() {
  try { localStorage.setItem(keptKey(), snapshot()); } catch {}
  statusEl.innerHTML = '✕ notes changed on disk, your version is kept <button type="button">reload</button>';
  statusEl.querySelector('button').onclick = () => location.reload();
}

function offerKept(kept) {
  statusEl.innerHTML = 'unsaved version from before a reload <button type="button">restore</button><button type="button">discard</button>';
  const [restoreBtn, discardBtn] = statusEl.querySelectorAll('button');
  const drop = () => { try { localStorage.removeItem(keptKey()); } catch {} statusEl.textContent = ''; };
  restoreBtn.onclick = () => {
    drop();
    doc.replaceChildren(clean(kept));
    vizPaint(doc);
    placeCards();
    buildIndex();
    save();
  };
  discardBtn.onclick = drop;
}

function leaving(e) {
  if (!pending) {
    if (inflight && e.type === 'beforeunload') e.preventDefault();
    return;
  }
  clearTimeout(pending);
  pending = null;
  if (conflict) return keep();
  const body = payload();
  if (!inflight && new Blob([body]).size < 60000) return fetch(topicUrl(), { method: 'POST', body, keepalive: true });
  pending = setTimeout(flush, 0);
  if (e.type === 'beforeunload') e.preventDefault();
}

const topicSlug = new URLSearchParams(location.search).get('topic');
topicSlug
  ? openTopic(topicSlug).catch(e => app.innerHTML =
      `<div class="sheet"><h1>could not open the topic</h1><p class="minor">${esc(e.message)}</p>
       <p><a href="notes.html">back</a></p></div>`)
  : menu();
</script>
