<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>独学 · settings</title>
<link rel="stylesheet" href="/app/styles/style.css">
<script src="/app/scripts/theme.js"></script>
<script src="/app/scripts/shell.js"></script>

<body>
<script>
const { app, tree, path } = mountShell('settings');
tree.innerHTML = configTree('');
path('~/self-learning-platform/settings.json');
app.innerHTML = `
  <div class="sheet">
  ${crumbs([['settings']])}
  ${promptLine('~/self-learning-platform', 'ls settings.json')}
  <h1>Settings</h1>
  <p class="minor"># one file, settings.json at the repo root, with a section per page</p>
  <table class="htop">
    <thead><tr><th class="num">#</th><th>SECTION</th></tr></thead>
    <tbody>${SETTING_PAGES.map(([href, name, about], i) => `
      <tr onclick="event.target.closest('a') || this.querySelector('a').click()">
        <td class="num">${pad(i + 1)}</td>
        <td class="wide"><a href="${href}">${name}</a><br><span class="sub">${esc(about)}</span></td>
      </tr>`).join('')}</tbody>
  </table>
  <div class="tildes"></div></div>`;
</script>
