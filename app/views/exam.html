<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>独学 · exams</title>
<link rel="stylesheet" href="/app/styles/style.css">
<script src="/app/scripts/theme.js"></script>
<script src="/app/scripts/viz.js"></script>
<script src="/app/scripts/shell.js"></script>
<style>
  .question { padding: var(--spacing-16) 0 var(--spacing-24); }
  .question + .question { border-top: 1px dashed var(--line); }
  .stem { display: flex; gap: .8rem; margin: 0 0 .7rem; }
  .stem .num { color: var(--ansi-orange); flex: none; }
  .option { display: flex; gap: .7rem; padding: .15rem 0 .15rem 3.4rem; cursor: pointer; }
  .option:hover { background: var(--color-graphite); }
  .option input { position: absolute; opacity: 0; pointer-events: none; }
  .option .box { flex: none; color: var(--muted); }
  .option .box::before { content: '( )'; }
  .option input:checked + .box { color: var(--accent); }
  .option input:checked + .box::before { content: '(•)'; }
  .option input:checked ~ span:last-child { color: var(--ink); font-weight: 700; }
  .option input:focus-visible + .box { outline: 1px solid var(--accent); }

  .graded { display: flex; gap: .7rem; padding: .15rem 0 .15rem 3.4rem; color: var(--muted); }
  .graded .tick { flex: none; width: 3ch; text-align: center; }
  .graded.correct { color: var(--good); }
  .graded.wrong-pick { color: var(--bad); }
  .graded.wrong-pick span:last-child { text-decoration: line-through; }
  .why { margin: .7rem 0 0 3.4rem; color: var(--muted); }
  .why::before { content: '// '; color: var(--color-steel); }

  .meter { display: flex; align-items: baseline; gap: .2rem; margin: var(--spacing-16) 0 .3rem; font-size: 16px; }
  .meter .label { color: var(--ansi-cyan); }
  .meter .cells { white-space: pre; color: var(--color-slate); }
  .meter .filled { color: var(--good); }
  .meter.bad .filled { color: var(--bad); }
  .meter .pct { color: var(--ink); font-weight: 700; }

  .answer { display: block; width: 100%; margin-top: .3rem; padding: .6rem .7rem;
    background: var(--color-graphite); color: var(--ink); border: 1px solid var(--line);
    border-radius: 0; font: 400 var(--text-body)/1.5 var(--mono); resize: vertical; }
  .oral { margin-top: .3rem; display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
  .oral-preview { height: 2.2rem; }
  .given-answer { margin: .3rem 0 0; color: var(--ink); white-space: pre-wrap; }
  .pending { margin: .3rem 0 0; color: var(--ansi-yellow); }
  .pending::before { content: '// '; color: var(--color-steel); }

  .exam-form:not(.is-quiz) .quiz-only { display: none; }
  .exam-form label.opt { display: flex; align-items: center; gap: .5rem; margin-bottom: .35rem; }
  .exam-form label.opt input[type=radio] { width: auto; accent-color: var(--good); }
</style>

<body>
<script>
const legacy = new URLSearchParams(location.search).get('f')?.match(/^topics\/([^/]+)\/exams\/([^/]+)\/exam\.json$/);
if (legacy) history.replaceState(null, '', `?topic=${encodeURIComponent(legacy[1])}&exam=${encodeURIComponent(legacy[2])}`);
const params = new URLSearchParams(location.search);
const { app, tree, tools, path, mode } = mountShell('exams');
const info = mode => tools.innerHTML = `<div class="wb-mod pill">${infoButton(keyIds(mode))}</div>`;
const statusEl = document.getElementById('status');
const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(p => p[1]);
const slug = params.get('topic');
const examName = slug && params.get('exam');
const file = examName && `topics/${slug}/exams/${examName}/exam.json`;
const link = (topic, name) => `?topic=${encodeURIComponent(topic)}&exam=${encodeURIComponent(name)}`;
const pendingOf = t => t.exams.reduce((n, e) => n + e.pending, 0);
let onKey = null, topicTitle = slug, draft = null;

function buildTree(topics) {
  tree.innerHTML = topics.map(t => folder(t.slug + '/', t.exams.length,
    `<ul>${t.exams.map(e => `<li><a href="${link(t.slug, e.name)}"${t.slug === slug && e.name === examName ? ' aria-current="page"' : ''}
        title="${esc(e.title)}"><span class="n">›</span><span>${esc(e.title)}</span></a></li>`).join('')
      || '<li class="empty">(no exams)</li>'}</ul>`,
    t.slug === slug, t.title)).join('');
}

async function load() {
  const data = await api('/api/exams');
  topicTitle = data.topics.find(t => t.slug === slug)?.title || slug;
  buildTree(data.topics);
  return data.topics;
}

async function index() {
  let topics;
  try {
    topics = await load();
  } catch (e) {
    app.innerHTML = offline(e);
    return;
  }
  path('~/topics/*/exams');
  examTools(topics);
  app.innerHTML = `
    <div class="sheet">
    ${crumbs([['exams']])}
    ${promptLine('~/topics', 'ls */exams')}
    <table class="htop">
      <thead><tr><th class="num">#</th><th>TOPIC</th><th>TYPE</th><th class="num">EXAMS</th><th class="num">PENDING</th></tr></thead>
      <tbody>${topics.map(l => `
        <tr onclick="event.target.closest('a') || this.querySelector('a').click()">
          <td class="num">${l.order < 1000 ? String(l.order).padStart(3, '0') : '—'}</td>
          <td class="wide"><a href="?topic=${encodeURIComponent(l.slug)}">${esc(l.title)}</a><br><span class="sub">${esc(l.subtitle || '')}</span></td>
          <td class="type">${esc(l.type)}</td>
          <td class="num${l.exams.length ? '' : ' zero'}">${l.exams.length}</td>
          <td class="num${pendingOf(l) ? '' : ' zero'}">${pendingOf(l)}</td>
        </tr>${l.exams.map(e => `
        <tr onclick="event.target.closest('a') || this.querySelector('a').click()">
          <td></td><td class="wide" colspan="3"><span class="sub">└─ </span><a href="${link(l.slug, e.name)}">${esc(e.title)}</a></td>
          <td class="num${e.pending ? '' : ' zero'}">${e.pending}</td>
        </tr>`).join('')}`).join('')}${topics.length ? '' : noTopicsRow(5)}</tbody>
    </table>
    <div class="tildes"></div></div>`;
}

async function topic() {
  let t;
  try {
    t = (await load()).find(t => t.slug === slug);
    if (!t) throw new Error('no such topic: ' + slug);
  } catch (e) {
    app.innerHTML = offline(e);
    return;
  }
  document.title = '独学 · ' + t.title;
  path(`~/topics/${slug}/exams`);
  info('exam.topic');
  examTools([t], slug);
  app.innerHTML = `
    <div class="sheet">
    ${crumbs([['exams', 'exam.html'], [t.title]])}
    ${promptLine('~/topics/' + slug, 'ls exams/')}
    <h1>${esc(t.title)}</h1>
    <p class="minor"># ${t.exams.length ? `${t.exams.length} exams · ${pendingOf(t)} attempts pending grading: /slp-grade` : 'no exams yet — ask your agent: /slp-exam, or write one with +'}</p>
    <table class="htop">
      <thead><tr><th class="num">#</th><th>EXAM</th><th class="num">QUESTIONS</th><th class="num">ATTEMPTS</th><th class="num">PENDING</th></tr></thead>
      <tbody>${t.exams.map((e, i) => `
        <tr onclick="event.target.closest('a') || this.querySelector('a').click()">
          <td class="num">${pad(i + 1)}</td>
          <td class="wide"><a href="${link(slug, e.name)}">${esc(e.title)}</a><br><span class="sub">exams/${esc(e.name)}/</span></td>
          <td class="num">${e.questions}</td>
          <td class="num${e.attempts ? '' : ' zero'}">${e.attempts}</td>
          <td class="num${e.pending ? '' : ' zero'}">${e.pending}</td>
        </tr>`).join('')}</tbody>
    </table>
    <div class="tildes"></div></div>`;
  mode('NORMAL');
  statusEl.textContent = `${t.exams.length} exams · ${pendingOf(t)} pending`;
}

const QTYPES = ['multiple_choice', 'open', 'oral', 'practical'];
const examApi = (topic, body) => api('/api/exams/' + encodeURIComponent(topic), JSON.stringify(body));
const examItems = topics => topics.flatMap(t => t.exams.map(e => [t.slug + '/' + e.name, (topics.length > 1 ? t.slug + ' › ' : '') + e.title, e.attempts ? e.attempts + ' attempts' : '']));

function examTools(topics, current) {
  tools.prepend(crudPill({ add: 'New exam', edit: 'Edit an exam', del: 'Delete exams' }, {
    add: (b, e) => current ? examForm(current)
      : dropMenu(b, topics.map(t => [t.slug, esc(t.title)]), s => examForm(s), null, e.detail === 0),
    edit: (b, e) => {
      const items = examItems(topics);
      if (!items.length) return statusEl.textContent = 'no exams to edit';
      dropMenu(b, items.map(([v, label]) => [v, esc(label)]), v => examForm(...v.split('/')), null, e.detail === 0);
    },
    del: async () => {
      const picked = await pickDelete('exams', examItems(topics), [], 'with their attempts');
      if (!picked) return;
      try {
        const byTopic = Object.groupBy(picked, v => v.split('/')[0]);
        for (const [topic, vs] of Object.entries(byTopic)) await examApi(topic, { delete: vs.map(v => v.split('/')[1]) });
        location.reload();
      } catch (e) {
        statusEl.textContent = '✕ ' + e.message;
      }
    },
  }));
}

let qSeq = 0;
const optRow = (n, j, o = '', right = false) => `<label class="opt"><input type="radio" name="answer-${n}" value="${j}"${right ? ' checked' : ''} aria-label="right answer" title="right answer">
  <input data-f="option" value="${esc(o)}" placeholder="option ${j + 1}" autocomplete="off"></label>`;

function qBlock(q = {}) {
  const type = q.type || 'multiple_choice', n = qSeq++;
  const opts = q.options?.length ? q.options : ['', '', '', ''];
  return `<fieldset class="q-block" data-n="${n}">
    <legend>question <span class="qn"></span></legend>
    <div class="cols">
      <label>type<select data-f="type">${options(QTYPES, type)}</select></label>
      <label class="quiz-only">thread<input data-f="thread" value="${esc(q.thread || '')}" placeholder="kebab-case" autocomplete="off"></label>
      <label class="quiz-only">level 1-5<input data-f="level" type="number" min="1" max="5" value="${esc(q.level ?? '')}"></label>
    </div>
    <label>question<textarea data-f="q" rows="2">${esc(q.q || '')}</textarea></label>
    <div class="mc"${type === 'multiple_choice' ? '' : ' hidden'}>
      <div class="opts">${opts.map((o, j) => optRow(n, j, o, q.answer === j)).join('')}</div>
      <button type="button" class="opt-add">+ option</button>
      <label>explanation · why the right one is right, what each wrong one confuses<textarea data-f="explanation" rows="2">${esc(q.explanation || '')}</textarea></label>
    </div>
    <label class="rubric"${type === 'multiple_choice' ? ' hidden' : ''}>rubric · 3-5 checkable points, one per line<textarea data-f="rubric" rows="3">${esc((q.rubric || []).join('\n'))}</textarea></label>
    <button type="button" class="q-remove">remove question</button>
  </fieldset>`;
}

function readQuestion(fs, quiz) {
  const f = k => fs.querySelector(`[data-f="${k}"]`).value.trim();
  const type = f('type');
  let q = { type, q: f('q'), rubric: lines(fs.querySelector('[data-f=rubric]').value) };
  if (type === 'multiple_choice') {
    const rows = [...fs.querySelectorAll('.opt')].filter(r => r.querySelector('[data-f=option]').value.trim());
    const answer = rows.findIndex(r => r.querySelector('[type=radio]').checked);
    q = { type, q: f('q'), options: rows.map(r => r.querySelector('[data-f=option]').value.trim()),
          ...(answer >= 0 ? { answer } : {}), explanation: f('explanation') };
  }
  return quiz ? { ...q, thread: f('thread'), ...(f('level') ? { level: +f('level') } : {}) } : q;
}

async function examForm(topic, name) {
  const exam = name ? await api(`/topics/${encodeURIComponent(topic)}/exams/${encodeURIComponent(name)}/exam.json`) : { questions: [] };
  const attempts = name ? (await load()).find(t => t.slug === topic)?.exams.find(e => e.name === name)?.attempts || 0 : 0;
  const save = async () => {
    const f = Object.fromEntries(new FormData(m.form));
    const quiz = f.kind === 'quiz';
    const blocks = [...m.form.querySelectorAll('.q-block')];
    const questions = blocks.map(fs => readQuestion(fs, quiz));
    const data = { title: f.title.trim(), ...(quiz ? { kind: 'quiz' } : {}), questions };
    try {
      const r = await examApi(topic, { save: name ? { name, exam: data } : { create: true, name: f.name.trim(), exam: data } });
      m.dlg.close();
      location.href = link(topic, r.name);
    } catch (e) {
      m.status(e.message);
    }
  };
  const m = modal('wide-form exam-form', name ? `edit exam · ${esc(topic)}/${esc(name)}` : `new exam · ${esc(topic)}`, `
    <label>title<input name="title" value="${esc(exam.title || '')}" placeholder="HTTP — 01: methods and codes" autocomplete="off"></label>
    <div class="cols">
      <label>kind<select name="kind">${options(['exam', 'quiz'], exam.kind === 'quiz' ? 'quiz' : 'exam')}</select></label>
      ${name ? '' : '<label>folder<input name="name" placeholder="auto: NN-title, or quiz" autocomplete="off"></label>'}
    </div>
    ${attempts ? `<p class="minor"># ${attempts} attempts point at these questions by position: changing or moving them makes old attempts read against the new questions</p>` : ''}
    <div class="q-list">${exam.questions.map(q => qBlock(q)).join('')}</div>
    <button type="button" class="q-add">+ add question</button>`,
    [['⌘⏎', 'Save', 'cta'], ['Esc', 'Cancel']], save);
  m.buttons[0].onclick = save;
  const list = m.form.querySelector('.q-list'), kind = m.form.elements.kind;
  const renumber = () => list.querySelectorAll('.qn').forEach((s, i) => s.textContent = i + 1);
  const syncKind = () => m.dlg.classList.toggle('is-quiz', kind.value === 'quiz');
  kind.onchange = syncKind;
  syncKind();
  const add = () => {
    list.insertAdjacentHTML('beforeend', qBlock());
    renumber();
    list.lastElementChild.querySelector('textarea').focus();
  };
  m.form.querySelector('.q-add').onclick = add;
  list.onclick = e => {
    const fs = e.target.closest('.q-block');
    if (e.target.closest('.opt-add')) {
      const box = fs.querySelector('.opts');
      box.insertAdjacentHTML('beforeend', optRow(fs.dataset.n, box.children.length));
      box.lastElementChild.querySelector('[data-f=option]').focus();
    }
    if (e.target.closest('.q-remove')) { fs.remove(); renumber(); }
  };
  list.onchange = e => {
    if (e.target.dataset.f !== 'type') return;
    const fs = e.target.closest('.q-block'), mc = e.target.value === 'multiple_choice';
    fs.querySelector('.mc').hidden = !mc;
    fs.querySelector('.rubric').hidden = mc;
  };
  if (!exam.questions.length) add();
  renumber();
  m.form.elements.title.focus();
}

function header(exam, note, command) {
  const parts = file.split('/');
  return `
    <div class="sheet">
    ${crumbs([['exams', 'exam.html'], [topicTitle, '?topic=' + encodeURIComponent(slug)], [exam.title || examName]])}
    ${promptLine('~/' + parts.slice(0, -1).join('/'), command + ' ' + parts.at(-1))}
    <h1>${esc(exam.title || 'Exam')}</h1>
    <p class="minor"># ${note}</p>`;
}

const leave = () => {
  if ([...app.querySelectorAll('.oral-preview')].some(a => a._blob) && !confirm('leave? recordings are not saved')) return;
  location.href = file ? '?topic=' + encodeURIComponent(slug) : 'exam.html';
};

const stemHTML = (q, i) => `<p class="stem"><span class="num">[${pad(i + 1)}]</span><span>${vizText(q.q)}</span></p>`;

function take(exam, saved) {
  const all = exam.questions.map((q, i) => ({ ...q, i }));
  const order = saved?.order;
  const questions = order?.length === all.length && all.every(q => order.includes(q.i)) ? order.map(i => all[i]) : shuffle(all);
  document.title = '独学 · ' + (exam.title || 'exam');
  path('~/' + file);

  app.innerHTML = header(exam, `${questions.length} questions · graded at the end`, 'exam') + `
    ${questions.map((q, i) => questionHTML(q, i)).join('')}
    <div class="keys">${key('Esc', 'Back')}${key(keyFor('exam.grade'), 'Finish exam', 'cta')}</div>
    <div class="tildes"></div></div>`;
  info('exam');

  vizPaint(app);
  app.querySelectorAll('.oral').forEach(div => {
    const question = div.closest('.question');
    if (!navigator.mediaDevices?.getUserMedia) return showText(question);
    div.querySelector('.record').onclick = () => recordOral(div.querySelector('.record'), div.querySelector('.oral-preview'));
    div.querySelector('.write-instead').onclick = () => showText(question);
  });
  const qEls = app.querySelectorAll('.question');
  const kept = Object.fromEntries((saved?.answers || []).map(a => [a.i, a]));
  questions.forEach((q, k) => {
    const a = kept[q.i];
    if (!a || a.q !== q.q) return;
    if (a.chosen != null) qEls[k].querySelector(`input[value="${a.chosen}"]`)?.click();
    if (a.text) {
      if (qEls[k].querySelector('.oral')) showText(qEls[k]);
      qEls[k].querySelector('textarea').value = a.text;
    }
  });
  let note = saved ? ' · draft restored' : '';
  const progress = () => {
    const picked = app.querySelectorAll('input:checked').length;
    const written = [...app.querySelectorAll('textarea.answer')].filter(t => t.value.trim()).length;
    const spoken = [...app.querySelectorAll('.oral-preview')].filter(a => a._blob).length;
    const answered = picked + written + spoken;
    statusEl.textContent = `${answered}/${questions.length} answered${note}`;
    mode(answered ? 'INSERT' : 'NORMAL', answered ? 'insert' : '');
  };
  draft = drafter(slug, 'exam', examName, () => ({
    order: questions.map(q => q.i),
    answers: questions.map((q, k) => {
      const sel = qEls[k].querySelector('input:checked'), text = qEls[k].querySelector('textarea')?.value || '';
      return { i: q.i, q: q.q, ...(sel ? { chosen: +sel.value } : {}), ...(text.trim() ? { text } : {}) };
    }),
  }), () => { note = ' · draft saved'; progress(); });
  progress();
  const edited = () => { note = ''; progress(); draft.touch(); };
  app.addEventListener('change', edited);
  app.addEventListener('input', edited);
  const [backBtn, gradeBtn] = app.querySelectorAll('.keys .key');
  let grading = false;
  gradeBtn.onclick = () => grading || (grading = true, grade(exam, questions));
  backBtn.onclick = leave;
  onKey = e => {
    const write = pressed(e, 'exam.write');
    if (write || pressed(e, 'exam.record')) {
      e.preventDefault();
      const q = e.target.closest?.('.question')
        || [...app.querySelectorAll('.oral')].find(o => o.style.display !== 'none')?.closest('.question');
      q?.querySelector(write ? '.write-instead' : '.record')?.click();
    }
    if (pressed(e, 'exam.grade') && !(native(e) && e.target.closest?.('button, .question'))) { e.preventDefault(); gradeBtn.click(); }
  };
}

function questionHTML(q, i) {
  const type = q.type || 'multiple_choice';
  const stem = stemHTML(q, i);
  if (type === 'multiple_choice') {
    return `<div class="question">${stem}
      ${q.options.map((o, j) => `
        <label class="option"><input type="radio" name="q${i}" value="${j}"><span class="box"></span><span>${vizText(o)}</span></label>`).join('')}
    </div>`;
  }
  if (type === 'oral') {
    return `<div class="question">${stem}
      <div class="oral">
        ${key(keyFor('exam.record'), 'Record', 'record')}
        <audio class="oral-preview" controls style="display:none"></audio>
        ${key(keyFor('exam.write'), 'Answer in writing', 'write-instead')}
      </div>
      <textarea class="answer oral-text" name="q${i}" rows="4" placeholder="Your answer" aria-label="answer ${i + 1}" style="display:none"></textarea>
    </div>`;
  }
  return `<div class="question">${stem}
      <textarea class="answer" name="q${i}" rows="4" placeholder="Your answer" aria-label="answer ${i + 1}"></textarea>
    </div>`;
}

function showText(question) {
  const oral = question.querySelector('.oral');
  if (oral) oral.style.display = 'none';
  const t = question.querySelector('.oral-text');
  t.style.display = '';
  t.focus();
}

function meter(pct) {
  const cells = 40, filled = Math.round(pct / 100 * cells);
  return `<div class="meter ${pct >= 70 ? 'good' : 'bad'}"><span class="label">Score</span><span class="cells">[<span class="filled">${'|'.repeat(filled)}</span>${' '.repeat(cells - filled)}]</span><span class="pct">${pct}%</span></div>`;
}

function recordOral(button, audio) {
  if (button.dataset.recording) { button.dataset.stop = '1'; return; }
  button.dataset.recording = '1';
  button._done = (async () => {
    let mic;
    try {
      mic = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) {
      delete button.dataset.recording;
      delete button.dataset.stop;
      statusEl.textContent = 'no microphone: ' + e.message;
      return showText(button.closest('.question'));
    }
    const recorder = new MediaRecorder(mic);
    const chunks = [];
    recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
    const stopped = new Promise(r => recorder.onstop = r);
    recorder.start();

    button.classList.add('recording');
    statusEl.textContent = `recording… ${keyFor('exam.record')} to finish`;
    await new Promise(r => (function check() { button.dataset.stop ? r() : setTimeout(check, 200); })());

    recorder.stop();
    await stopped;
    mic.getTracks().forEach(t => t.stop());
    delete button.dataset.recording;
    delete button.dataset.stop;
    button.classList.remove('recording');

    const blob = new Blob(chunks, { type: recorder.mimeType });
    audio._blob = blob;
    audio._mime = blob.type;
    audio.src = URL.createObjectURL(blob);
    audio.style.display = '';
    statusEl.textContent = 'recording ready';
    audio.dispatchEvent(new Event('input', { bubbles: true }));
  })();
}

const blobToBase64 = blob => new Promise((res, rej) => {
  const r = new FileReader();
  r.onload = () => res(r.result.split(',')[1]);
  r.onerror = rej;
  r.readAsDataURL(blob);
});

const saveAttempt = answers => api('/api/exams/' + encodeURIComponent(slug), JSON.stringify({ attempt: { exam: examName, answers } }))
  .catch(e => ({ error: e.message }));

const savedLine = saved => saved.error
  ? `could not save the attempt: ${esc(saved.error)}`
  : `run <code>slp-grade</code> on this attempt — saved to <code>${esc(saved.path)}</code>`;

async function grade(exam, questions) {
  await draft.stop();
  app.querySelectorAll('.record[data-recording]').forEach(b => b.dataset.stop = '1');
  await Promise.all([...app.querySelectorAll('.record')].map(b => b._done));
  let right = 0, totalMC = 0;
  const answers = [];
  const detail = (await Promise.all(questions.map(async (q, i) => {
    const type = q.type || 'multiple_choice';
    const stem = stemHTML(q, i);
    if (type === 'multiple_choice') {
      totalMC++;
      const sel = app.querySelector(`input[name=q${i}]:checked`);
      const chosen = sel ? +sel.value : null;
      if (chosen === q.answer) right++;
      answers.push({ i: q.i, type, chosen });
      return `<div class="question">${stem}
        ${q.options.map((o, j) => {
          const cls = j === q.answer ? 'correct' : (j === chosen ? 'wrong-pick' : '');
          const tick = j === q.answer ? '✓' : (j === chosen ? '✕' : '·');
          return `<div class="graded ${cls}"><span class="tick">${tick}</span><span>${vizText(o)}</span></div>`;
        }).join('')}
        ${q.explanation ? `<p class="why">${vizText(q.explanation)}</p>` : ''}
      </div>`;
    }
    const qEl = app.querySelectorAll('.question')[i];
    const audio = qEl.querySelector('.oral-preview');
    if (audio?._blob) {
      answers.push({ i: q.i, type, audio: await blobToBase64(audio._blob), mime: audio._mime });
      return `<div class="question">${stem}
        <p class="given-answer">(audio recorded)</p>
        <p class="pending">pending grading</p>
      </div>`;
    }
    const text = qEl.querySelector('textarea')?.value.trim() || '';
    answers.push({ i: q.i, type, text });
    return `<div class="question">${stem}
      <p class="given-answer">${text ? esc(text) : '<em>(no answer)</em>'}</p>
      <p class="pending">pending grading</p>
    </div>`;
  }))).join('');

  const pct = totalMC ? Math.round(right / totalMC * 100) : null;
  const saved = await saveAttempt(answers);

  app.innerHTML = header(exam, `${questions.length} questions`, 'exam --check') + `
    ${pct !== null ? meter(pct) : ''}
    <p class="minor"># ${totalMC ? `${right} of ${totalMC} correct (multiple choice)` : 'no multiple-choice questions'}</p>
    ${detail}
    <p class="minor">${savedLine(saved)}</p>
    <div class="keys">${key('Esc', 'Back')}${key(keyFor('exam.retake'), 'Retake', 'cta')}</div>
    <div class="tildes"></div></div>`;
  info('exam.results');
  vizPaint(app);
  mode(pct === null ? 'DONE' : (pct >= 70 ? 'PASS' : 'FAIL'), pct !== null && pct >= 70 ? 'insert' : '');
  statusEl.textContent = totalMC ? `${right}/${totalMC} correct` : 'attempt saved';
  const [back, again] = app.querySelectorAll('.keys .key');
  again.onclick = () => location.reload();
  back.onclick = leave;
  onKey = e => { if (pressed(e, 'exam.retake') && !(native(e) && e.target.closest?.('button'))) { e.preventDefault(); again.click(); } };
  scrollTo(0, 0);
}

addEventListener('keydown', e => {
  if (!slug || e.repeat) return;
  if (e.target.closest?.('textarea, input[type=text], select')) return;
  if (e.key === 'Escape' && !(e.metaKey || e.ctrlKey || e.altKey)) return leave();
  onKey?.(e);
});

app.addEventListener('mousedown', e => { if (e.target.closest('.key')) e.preventDefault(); });

file
  ? Promise.all([api(`/topics/${encodeURIComponent(slug)}/exams/${encodeURIComponent(examName)}/exam.json`), load(),
      drafter(slug, 'exam', examName).load()])
      .then(([exam, , saved]) => {
        if (!exam?.questions?.length) throw new Error('no questions in ' + file);
        take(exam, saved);
      }).catch(e => app.innerHTML = offline(e))
  : slug ? topic() : index();
</script>
