[project]
name = "slp"
version = "0.1.0"
description = "SLP: SelfLearningPlatform, an agent-powered hub for self-learners"
requires-python = ">=3.9"
dependencies = [
  "mlx-whisper; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "faster-whisper; sys_platform != 'win32' or platform_machine != 'ARM64'",
]

[project.scripts]
slp = "server:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "app/server" }
py-modules = ["server", "store", "text", "voice"]
